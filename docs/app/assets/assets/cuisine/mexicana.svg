<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" data-cuisine="mexicana">
<title>Taco mexicano</title>
<defs>
<clipPath id="flag-clip-mx"><rect width="26" height="18" rx="4"/></clipPath>
</defs>
<rect width="160" height="160" rx="24" fill="#0D9488"/>
<g filter="drop-shadow(0 4px 10px rgba(0,0,0,0.25))">
<!-- Sticker outline -->
<path d="M38 108 C38 64 122 64 122 108 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
<!-- Taco shell -->
<path d="M40 108 C40 68 120 68 120 108 C108 114 52 114 40 108 Z" fill="#F59E0B"/>
<path d="M46 104 C46 74 114 74 114 104 Z" fill="#D97706"/>
<!-- Meat, lettuce, tomato filling -->
<path d="M46 98 Q80 86 114 98" fill="#78350F" stroke="#78350F" stroke-width="12" stroke-linecap="round"/>
<path d="M48 94 Q80 84 112 94" fill="#15803D" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
<circle cx="64" cy="90" r="4" fill="#DC2626"/>
<circle cx="82" cy="88" r="4.5" fill="#DC2626"/>
<circle cx="98" cy="92" r="4" fill="#DC2626"/>
<circle cx="72" cy="94" r="3" fill="#FDE047"/>
<circle cx="90" cy="94" r="3" fill="#FDE047"/>
<!-- Lime wedge -->
<path d="M106 116 L124 106 A12 12 0 0 1 124 126 Z" fill="#84CC16" stroke="#FFFFFF" stroke-width="2"/>
</g>
<g class="flag-badge" transform="translate(14,14)">
<rect width="26" height="18" rx="4" fill="#0F172A" opacity="0.6"/>
<g clip-path="url(#flag-clip-mx)">
<rect width="8.67" height="18" fill="#006847"/>
<rect x="8.67" width="8.67" height="18" fill="#FFFFFF"/>
<rect x="17.33" width="8.67" height="18" fill="#CE1126"/>
<circle cx="13" cy="9" r="2.2" fill="#8B5A2B"/>
</g>
<rect width="26" height="18" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
</g>
</svg>
