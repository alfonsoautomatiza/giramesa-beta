<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" data-cuisine="sushi">
<title>Sushi variados</title>
<defs>
<clipPath id="flag-clip-jp"><rect width="26" height="18" rx="4"/></clipPath>
</defs>
<rect width="160" height="160" rx="24" fill="#0F172A"/>
<g filter="drop-shadow(0 4px 10px rgba(0,0,0,0.25))">
<!-- Sticker outline -->
<rect x="36" y="78" width="88" height="34" rx="6" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
<!-- Wooden geta board -->
<rect x="38" y="82" width="84" height="28" rx="4" fill="#D97706"/>
<rect x="38" y="106" width="10" height="6" fill="#92400E"/>
<rect x="112" y="106" width="10" height="6" fill="#92400E"/>
<!-- Salmon nigiri -->
<ellipse cx="54" cy="78" rx="10" ry="7" fill="#FFFFFF"/>
<ellipse cx="54" cy="76" rx="10" ry="6" fill="#FB7185"/>
<path d="M48 76 Q54 74 60 76" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
<!-- Tuna nigiri -->
<ellipse cx="80" cy="78" rx="10" ry="7" fill="#FFFFFF"/>
<ellipse cx="80" cy="76" rx="10" ry="6" fill="#E11D48"/>
<rect x="78" y="71" width="4" height="12" rx="1" fill="#047857"/>
<!-- Cucumber maki -->
<circle cx="106" cy="76" r="9" fill="#064E3B"/>
<circle cx="106" cy="76" r="7.5" fill="#FFFFFF"/>
<circle cx="106" cy="76" r="3" fill="#22C55E"/>
</g>
<g class="flag-badge" transform="translate(14,14)">
<rect width="26" height="18" rx="4" fill="#0F172A" opacity="0.6"/>
<g clip-path="url(#flag-clip-jp)">
<rect width="26" height="18" fill="#FFFFFF"/>
<circle cx="13" cy="9" r="5" fill="#BC002D"/>
</g>
<rect width="26" height="18" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
</g>
</svg>
