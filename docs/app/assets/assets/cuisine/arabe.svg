<ellipse cx="68" cy="106" rx="36" ry="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8"/>
<polygon points="98,64 128,48 116,98" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
