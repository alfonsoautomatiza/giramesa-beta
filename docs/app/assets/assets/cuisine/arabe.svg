<ellipse cx="68" cy="96" rx="22" ry="10" fill="#FDE047"/>
<!-- Chickpeas and vegetables on couscous -->
<circle cx="62" cy="96" r="3" fill="#D97706"/>
<circle cx="74" cy="94" r="3" fill="#D97706"/>
<circle cx="68" cy="100" r="3.5" fill="#D97706"/>
<path d="M60 92 Q68 88 76 92" stroke="#15803D" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M66 98 Q72 102 78 98" stroke="#DC2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
