name: Release test builds
run-name: Release test builds from ${{ inputs.expected_commit_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: Exact reviewed commit expected after checkout
        required: true
        type: string
      beta_repository:
        description: Public owner/repository receiving non-iOS assets
        required: true
        default: wertyMSD/giramesa-beta
        type: string
      release_notes_base64:
        description: UTF-8 public release notes encoded as base64
        required: true
        type: string
      api_base_url:
        description: Optional public HTTPS API URL
        required: false
        type: string
      run_android:
        description: Build and publish Android
        required: true
        default: true
        type: boolean
      run_web:
        description: Build and publish web archive
        required: true
        default: true
        type: boolean
      run_windows:
        description: Build and publish Windows ZIP
        required: true
        default: true
        type: boolean
      run_ios:
        description: Build iOS and upload only to TestFlight
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: test-release-${{ inputs.expected_commit_sha }}
  cancel-in-progress: false

env:
  APP_DIRECTORY: app
  FLUTTER_VERSION: '3.44.0'
  API_BASE_URL: ${{ inputs.api_base_url }}
  BETA_REPOSITORY: ${{ inputs.beta_repository }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.pubspec.outputs.release_version }}
      build_number: ${{ steps.pubspec.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify commit, inputs, and Flutter pubspec authority
        id: pubspec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import ipaddress
          import os
          import re
          import socket
          from pathlib import Path
          from urllib.parse import urlsplit

          expected = os.environ['EXPECTED_COMMIT_SHA']
          actual = os.popen('git rev-parse HEAD').read().strip()
          if not re.fullmatch(r'[0-9a-f]{40}', expected) or actual != expected:
              raise SystemExit(f'Checked-out SHA does not match expected SHA: expected {expected}, got {actual}')

          pubspec = Path('app/pubspec.yaml').read_text(encoding='utf-8')
          version_lines = [line for line in pubspec.splitlines() if line.startswith('version:')]
          if len(version_lines) != 1:
              raise SystemExit(f"app/pubspec.yaml must contain exactly one top-level 'version:' key; found {len(version_lines)}")
          semver = r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?'
          match = re.fullmatch(rf'version:[ \t]*(?P<version>{semver})\+(?P<build>[1-9][0-9]*)[ \t]*', version_lines[0])
          if not match:
              raise SystemExit("Flutter version must be strict SemVer plus a positive build integer, for example 'version: 0.1.1+2'")
          build = int(match.group('build'))
          if build > 2147483647:
              raise SystemExit('Flutter build number exceeds the supported 32-bit platform range')

          try:
              notes = base64.b64decode(os.environ['RELEASE_NOTES_BASE64'], validate=True)
              notes.decode('utf-8')
          except (binascii.Error, UnicodeDecodeError) as error:
              raise SystemExit('Release notes must be valid base64-encoded UTF-8') from error
          if not notes or len(notes) > 40960 or b'\0' in notes or not notes.strip():
              raise SystemExit('Release notes must contain 1 byte to 40 KiB of non-empty UTF-8 without NUL bytes')

          api_url = os.environ.get('API_BASE_URL', '')
          if api_url:
              parsed = urlsplit(api_url)
              if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
                  raise SystemExit('api_base_url must be public HTTPS without credentials, query, or fragment')
              addresses = {item[4][0] for item in socket.getaddrinfo(parsed.hostname, 443, type=socket.SOCK_STREAM)}
              if not addresses or any(not ipaddress.ip_address(address).is_global for address in addresses):
                  raise SystemExit('api_base_url must resolve only to public IP addresses')

          beta_repository = os.environ['BETA_REPOSITORY']
          if not re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', beta_repository):
              raise SystemExit('beta_repository must be an owner/repository slug')
          if not any(os.environ[name] == 'true' for name in ('RUN_ANDROID', 'RUN_WEB', 'RUN_WINDOWS', 'RUN_IOS')):
              raise SystemExit('At least one platform must be selected')

          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f"release_version={match.group('version')}\n")
              output.write(f"build_number={build}\n")
          PY
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          RELEASE_NOTES_BASE64: ${{ inputs.release_notes_base64 }}
          RUN_ANDROID: ${{ inputs.run_android }}
          RUN_WEB: ${{ inputs.run_web }}
          RUN_WINDOWS: ${{ inputs.run_windows }}
          RUN_IOS: ${{ inputs.run_ios }}
      - name: Fail fast on missing selected-platform configuration
        shell: bash
        env:
          RUN_ANDROID: ${{ inputs.run_android }}
          RUN_WEB: ${{ inputs.run_web }}
          RUN_WINDOWS: ${{ inputs.run_windows }}
          RUN_IOS: ${{ inputs.run_ios }}
          BETA_RELEASE_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          require() { test -n "${!1}" || { echo "Required secret is missing: $1" >&2; exit 1; }; }
          if [[ "$RUN_ANDROID" == 'true' || "$RUN_WEB" == 'true' || "$RUN_WINDOWS" == 'true' ]]; then
            require BETA_RELEASE_TOKEN
          fi
          if [[ "$RUN_ANDROID" == 'true' ]]; then
            for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do require "$name"; done
            if grep -ERq "signingConfig[[:space:]]*=[[:space:]]*signingConfigs\.getByName\([\"']debug[\"']\)" "$APP_DIRECTORY/android/app"; then
              echo 'Release signing still selects Android Debug. Configure the private Gradle project for key.properties.' >&2
              exit 1
            fi
            grep -ERq 'key\.properties|keystore\.properties' "$APP_DIRECTORY/android/app" || { echo 'No private Android release-signing properties integration was found.' >&2; exit 1; }
          fi
          if [[ "$RUN_IOS" == 'true' ]]; then
            for name in IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_EXPORT_OPTIONS_PLIST_BASE64 APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do require "$name"; done
            test -f "$APP_DIRECTORY/ios/Runner.xcodeproj/project.pbxproj" || { echo 'The private app has no iOS Xcode project.' >&2; exit 1; }
          fi

  android:
    if: ${{ inputs.run_android }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app/android/*.gradle*
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}
      - name: Install Android signing material
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/giramesa-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/giramesa-release.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > "$APP_DIRECTORY/android/key.properties"
      - name: Resolve dependencies and test
        working-directory: app
        run: flutter pub get && flutter test
      - name: Build signed release APK
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          args=(build apk --release --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER")
          if [[ -n "$API_BASE_URL" ]]; then args+=(--dart-define="API_BASE_URL=$API_BASE_URL"); fi
          flutter "${args[@]}"
      - name: Verify non-debug signing and stage immutable asset
        shell: bash
        run: |
          set -euo pipefail
          apk="$APP_DIRECTORY/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          signer="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f -print | sort -V | tail -n 1)"
          test -x "$signer"
          verification="$($signer verify --verbose --print-certs "$apk")"
          if grep -qi 'Android Debug' <<<"$verification"; then echo 'Android Debug certificate detected; refusing publication.' >&2; exit 1; fi
          grep -q 'Verified using' <<<"$verification"
          mkdir -p out
          asset="giramesa-android-v${RELEASE_VERSION}-b${BUILD_NUMBER}.apk"
          cp "$apk" "out/$asset"
          (cd out && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: public-android-v${{ needs.metadata.outputs.release_version }}-b${{ needs.metadata.outputs.build_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing material
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/giramesa-release.jks" "$APP_DIRECTORY/android/key.properties"

  web:
    if: ${{ inputs.run_web }}
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}
      - name: Resolve dependencies and test
        working-directory: app
        run: flutter pub get && flutter test
      - name: Build release web archive
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          args=(build web --release --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER")
          if [[ -n "$API_BASE_URL" ]]; then args+=(--dart-define="API_BASE_URL=$API_BASE_URL"); fi
          flutter "${args[@]}"
          mkdir -p ../out
          asset="giramesa-web-v${RELEASE_VERSION}-b${BUILD_NUMBER}.zip"
          (cd build/web && zip -q -r "../../../out/$asset" .)
          (cd ../out && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: public-web-v${{ needs.metadata.outputs.release_version }}-b${{ needs.metadata.outputs.build_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  windows:
    if: ${{ inputs.run_windows }}
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}
      - name: Resolve dependencies and test
        working-directory: app
        shell: pwsh
        run: flutter pub get; if ($LASTEXITCODE) { exit $LASTEXITCODE }; flutter test; if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build release Windows ZIP
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('build', 'windows', '--release', '--build-name', $env:RELEASE_VERSION, '--build-number', $env:BUILD_NUMBER)
          if ($env:API_BASE_URL) { $arguments += "--dart-define=API_BASE_URL=$env:API_BASE_URL" }
          & flutter @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $source = 'build/windows/x64/runner/Release/*'
          $asset = "giramesa-windows-v$env:RELEASE_VERSION-b$env:BUILD_NUMBER.zip"
          New-Item -ItemType Directory -Path '../out' -Force | Out-Null
          Compress-Archive -Path $source -DestinationPath "../out/$asset" -CompressionLevel Optimal
          $hash = (Get-FileHash "../out/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("../out/$asset.sha256", "$hash  $asset`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: public-windows-v${{ needs.metadata.outputs.release_version }}-b${{ needs.metadata.outputs.build_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  ios:
    if: ${{ inputs.run_ios }}
    needs: metadata
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock') }}
      - name: Install temporary iOS signing material
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/release.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/release.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/release.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/release.keychain-db" login.keychain-db
          profile_uuid="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)"
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
      - name: Resolve dependencies and test
        working-directory: app
        run: flutter pub get && flutter test
      - name: Build signed release IPA
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          args=(build ipa --release --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER" --export-options-plist "$RUNNER_TEMP/ExportOptions.plist")
          if [[ -n "$API_BASE_URL" ]]; then args+=(--dart-define="API_BASE_URL=$API_BASE_URL"); fi
          flutter "${args[@]}"
          ipa_count="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f | wc -l | tr -d ' ')"
          test "$ipa_count" = '1' || { echo 'Expected exactly one signed IPA.' >&2; exit 1; }
      - name: Upload signed IPA directly to TestFlight
        working-directory: app
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Remove iOS signing material and IPA
        if: ${{ always() }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"; fi
          rm -rf "$APP_DIRECTORY/build/ios/ipa"

  publish-public-release:
    if: ${{ always() && !cancelled() && (inputs.run_android || inputs.run_web || inputs.run_windows) && needs.metadata.result == 'success' && (!inputs.run_android || needs.android.result == 'success') && (!inputs.run_web || needs.web.result == 'success') && (!inputs.run_windows || needs.windows.result == 'success') && (!inputs.run_ios || needs.ios.result == 'success') }}
    needs: [metadata, android, web, windows, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
      BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: public-*
          path: dist
          merge-multiple: true
      - name: Validate public asset boundary and notes
        shell: bash
        env:
          RELEASE_NOTES_BASE64: ${{ inputs.release_notes_base64 }}
        run: |
          set -euo pipefail
          mkdir -p metadata
          printf '%s' "$RELEASE_NOTES_BASE64" | base64 --decode > metadata/release-notes.md
          test -s metadata/release-notes.md
          if find dist -type f \( -iname '*.ipa' -o -iname '*.jks' -o -iname '*.keystore' -o -iname '*.p12' -o -iname '*.p8' -o -iname '*.mobileprovision' -o -iname '*.key' -o -iname '*.pem' \) -print -quit | grep -q .; then
            echo 'Private iOS/signing material reached the public artifact boundary.' >&2
            exit 1
          fi
          unexpected="$(find dist -type f ! -name '*.apk' ! -name '*.zip' ! -name '*.sha256' -print -quit)"
          test -z "$unexpected" || { echo 'Unexpected file reached the public artifact boundary.' >&2; exit 1; }
          printf '\nBuild number: %s\nAndroid versionCode / iOS CFBundleVersion: %s\nSource commit: %s\n' "$BUILD_NUMBER" "$BUILD_NUMBER" '${{ inputs.expected_commit_sha }}' >> metadata/release-notes.md
      - name: Publish immutable public GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BETA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$BETA_REPOSITORY" >/dev/null 2>&1 || gh api "repos/$BETA_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag or Release $tag already exists; edit app/pubspec.yaml and use a new version." >&2
            exit 1
          fi
          mapfile -d '' assets < <(find dist -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.sha256' \) -print0)
          test "${#assets[@]}" -gt 0
          prerelease=()
          [[ "$RELEASE_VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$tag" "${assets[@]}" --repo "$BETA_REPOSITORY" --title "Giramesa $RELEASE_VERSION" --notes-file metadata/release-notes.md "${prerelease[@]}"
