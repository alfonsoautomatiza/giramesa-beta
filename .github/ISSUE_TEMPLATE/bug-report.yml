name: Comunicar un problema de la versión de prueba
description: Informá un fallo de instalación o uso sin publicar información personal o sensible.
title: "[Problema]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a probar Giramesa. Esta incidencia será pública.

        **No incluyas nombres, correos, teléfonos, ubicación, UDID, números de serie, tokens, contraseñas, enlaces privados, datos introducidos en la aplicación ni capturas con información personal.**
  - type: dropdown
    id: platform
    attributes:
      label: Plataforma
      options:
        - Android
        - iPhone / TestFlight
        - Portal web
        - Otra
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Giramesa
      description: Indicá solo la versión visible, por ejemplo 1.4.0. No adjuntes el archivo.
      placeholder: 1.4.0
  - type: input
    id: system
    attributes:
      label: Dispositivo y sistema
      description: Modelo general y versión del sistema, sin identificadores únicos.
      placeholder: Pixel 8 con Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Explicá qué hiciste y qué ocurrió, eliminando cualquier dato personal.
      placeholder: |
        1. Abrí...
        2. Pulsé...
        3. Apareció...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Confirmación de privacidad
      options:
        - label: Confirmo que revisé el contenido y no incluye datos personales, credenciales ni información sensible.
          required: true
